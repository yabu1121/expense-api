services:
  api:
    build:
      context: .
    image: expense-api:multi
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/expenses.db
      DATABASE_URL: postgres://expense:expense@postgres:5432/expense?sslmode=disable
    volumes:
      - expense-data:/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: expense
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  expense-data:
    name: expense-data

  postgres-data:
    name: postgres-data
