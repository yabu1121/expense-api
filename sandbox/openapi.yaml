openapi: 3.0.3
info:
  title: Expense API
  version: 1.0.0
  description: Go標準ライブラリとSQLiteで実装した学習用REST API
servers:
  - url: /
    description: Current server
tags:
  - name: System
  - name: Expenses
  - name: Categories
  - name: Tags
  - name: Expense Tags
paths:
  /health:
    get:
      tags: [System]
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        "200":
          description: APIは稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /version:
    get:
      tags: [System]
      summary: APIバージョン取得
      operationId: getVersion
      responses:
        "200":
          description: バージョン文字列
          content:
            text/plain:
              schema:
                type: string
                example: v1.0.0
  /expenses:
    get:
      tags: [Expenses]
      summary: 支出一覧取得
      description: created_atの降順で全件を返します。
      operationId: listExpenses
      responses:
        "200":
          description: 支出一覧。0件の場合は空配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Expenses]
      summary: 支出作成
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
      responses:
        "201":
          description: 作成した支出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expenses/{id}:
    parameters:
      - $ref: "#/components/parameters/ExpenseID"
    get:
      tags: [Expenses]
      summary: 支出の1件取得
      operationId: getExpenseById
      responses:
        "200":
          description: 支出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Expenses]
      summary: 支出更新
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
      responses:
        "200":
          description: 更新した支出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Expenses]
      summary: 支出削除
      operationId: deleteExpense
      responses:
        "204":
          description: 削除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expenses/summary:
    get:
      tags: [Expenses]
      summary: 支出集計取得
      operationId: getExpenseSummary
      responses:
        "200":
          description: 件数と合計金額
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSummary"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /categories:
    get:
      tags: [Categories]
      summary: カテゴリ一覧取得
      operationId: listCategories
      responses:
        "200":
          description: カテゴリ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Categories]
      summary: カテゴリ作成
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "201":
          description: 作成したカテゴリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /categories/{id}:
    get:
      tags: [Categories]
      summary: カテゴリの1件取得
      operationId: getCategoryById
      parameters:
        - $ref: "#/components/parameters/CategoryID"
      responses:
        "200":
          description: カテゴリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tags:
    get:
      tags: [Tags]
      summary: タグ一覧取得
      operationId: listTags
      responses:
        "200":
          description: タグ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Tags]
      summary: タグ作成
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "201":
          description: 作成したタグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expenses/{expenseID}/tags/{tagID}:
    post:
      tags: [Expense Tags]
      summary: 支出とタグを関連付け
      operationId: addTagToExpense
      parameters:
        - $ref: "#/components/parameters/ExpensePathID"
        - $ref: "#/components/parameters/TagID"
      responses:
        "204":
          description: 関連付け成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    ExpenseID:
      name: id
      in: path
      required: true
      description: Expense UUID
      schema:
        type: string
        format: uuid
    CategoryID:
      name: id
      in: path
      required: true
      description: Category UUID
      schema:
        type: string
        format: uuid
    ExpensePathID:
      name: expenseID
      in: path
      required: true
      description: Expense UUID
      schema:
        type: string
        format: uuid
    TagID:
      name: tagID
      in: path
      required: true
      description: Tag UUID
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ExpenseRequest:
      type: object
      required: [title, amount, category_id]
      properties:
        title:
          type: string
          minLength: 1
          example: coffee
        amount:
          type: integer
          minimum: 1
          example: 500
        category_id:
          type: string
          format: uuid
    Expense:
      allOf:
        - $ref: "#/components/schemas/ExpenseRequest"
        - type: object
          required: [id, created_at]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
    ExpenseSummary:
      type: object
      required: [count, total_amount]
      properties:
        count:
          type: integer
          minimum: 0
          example: 2
        total_amount:
          type: integer
          minimum: 0
          example: 1050
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: food
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: food
    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: outside
  responses:
    BadRequest:
      description: リクエスト形式、UUID、または入力値が不正
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: 対象が存在しない
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: 同じ名前または関連がすでに存在する
      content:
        text/plain:
          schema:
            type: string
    InternalServerError:
      description: サーバー内部エラー
      content:
        text/plain:
          schema:
            type: string
